# Generate the Xcode project with:  brew install xcodegen && xcodegen
# Before generating, replace every "com.example" below (and appGroupID in
# Shared/Storage.swift) with your own identifier, e.g. com.yourname.
name: KidProfiles
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.4"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"
    CODE_SIGN_STYLE: Automatic
targets:
  KidProfiles:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.KidProfiles
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kid Profiles
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/KidProfiles.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.example.kidprofiles
    dependencies:
      - target: KidMonitor
  KidMonitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.KidProfiles.KidMonitor
    info:
      path: Monitor/Info.plist
      properties:
        CFBundleDisplayName: KidMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KidMonitorExtension
    entitlements:
      path: Monitor/KidMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.example.kidprofiles
